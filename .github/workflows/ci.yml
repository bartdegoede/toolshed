name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Oldest supported (the go.mod minimum) and the latest release.
        go: ["1.26.x", stable]
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - uses: extractions/setup-just@v4

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go mod tidy
        run: |
          go mod tidy && git diff --exit-code go.mod go.sum
          (cd examples/ping-mcp && go mod tidy) && git diff --exit-code examples/ping-mcp/go.mod examples/ping-mcp/go.sum
      - name: go vet
        run: go vet ./... && (cd examples/ping-mcp && go vet ./...)
      - name: Unit tests
        run: just test
      - name: E2E tests
        run: just test-e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          (cd examples/ping-mcp && govulncheck ./...)

  # toolshed against the real Claude Code and Codex CLIs (test/contract.sh).
  # Pinned so a client release can't break CI unannounced; bump them on
  # purpose (and run this job) when the clients change their config.
  contract:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: contract (${{ matrix.os }})
    env:
      CLAUDE_CODE_VERSION: 2.1.319
      CODEX_VERSION: 0.167.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: extractions/setup-just@v4
      - name: Install the real clients
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" "@openai/codex@$CODEX_VERSION"
      - name: Contract tests
        run: just test-contract
