name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Oldest supported (the go.mod minimum) and the latest release.
        go: ["1.26.x", stable]
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - uses: extractions/setup-just@v4

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go mod tidy
        run: |
          go mod tidy && git diff --exit-code go.mod go.sum
          (cd examples/ping-mcp && go mod tidy) && git diff --exit-code examples/ping-mcp/go.mod examples/ping-mcp/go.sum
      - name: go vet
        run: go vet ./... && (cd examples/ping-mcp && go vet ./...)
      - name: Unit tests
        run: just test
      - name: E2E tests
        run: just test-e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          (cd examples/ping-mcp && govulncheck ./...)

  # toolshed against the real Claude Code, Codex and Antigravity CLIs
  # (test/contract.sh).
  # Pinned so a client release can't break CI unannounced; bump them on
  # purpose (and run this job) when the clients change their config.
  contract:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: contract (${{ matrix.os }})
    env:
      CLAUDE_CODE_VERSION: 2.1.319
      CODEX_VERSION: 0.167.0
      # Antigravity CLI isn't on npm: its install script only fetches the
      # latest release, so CI downloads a pinned one and checks its SHA-512
      # (both from https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/<platform>.json).
      AGY_VERSION: 1.5.5
      AGY_LINUX_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.5-6740358537805824/linux-x64/cli_linux_x64.tar.gz
      AGY_LINUX_SHA512: 746a2bd73f83b65d9b44f2fc55d0f0f511ff7f89702846213eeabd76d06bc9c98576b424c2babc7b947f15e518447b946ba02dca260b778363c55c07a7f7a277
      AGY_MACOS_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.5-6740358537805824/darwin-arm/cli_mac_arm64.tar.gz
      AGY_MACOS_SHA512: ca6424867a4527698e54b805c2456605b905a49ffc9b664ae2ee0fd4510fcd7b82d9721b2622a1d46048156a44431dc894359177fae44207363c8c878687b647
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: extractions/setup-just@v4
      - name: Install the real clients
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" "@openai/codex@$CODEX_VERSION"
      - name: Install the real Antigravity CLI (pinned)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then url="$AGY_MACOS_URL"; sha="$AGY_MACOS_SHA512"; else url="$AGY_LINUX_URL"; sha="$AGY_LINUX_SHA512"; fi
          curl -fsSL -o "$RUNNER_TEMP/agy.tar.gz" "$url"
          echo "$sha  $RUNNER_TEMP/agy.tar.gz" | shasum -a 512 -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/agy.tar.gz" -C "$RUNNER_TEMP" antigravity
          mv "$RUNNER_TEMP/antigravity" "$HOME/.local/bin/agy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agy" --version | grep -qx "$AGY_VERSION"
      - name: Contract tests
        run: just test-contract
